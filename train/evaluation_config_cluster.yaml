# Configuration file for evaluate_models.py on Lambda cluster
# 
# Usage:
#   python evaluate_models.py --config evaluation_config_cluster.yaml
#
#   Or with parallel evaluation:
#   python evaluate_models_parallel.py --config evaluation_config_cluster.yaml --parallel --num-gpus 4

# Glob pattern for input training split files
# Note: The actual files are .pkl.gz, not .pickle
# Using pattern to match files 080-089:
input_glob: "../data/samples/runners_split_[0][8][0-9].pkl.gz"
# Or use a simpler pattern to load all files:
# input_glob: "../data/samples/*.pkl.gz"

# Number of examples to evaluate
num_examples: 100000

# Output pickle file path
output: "evaluation_results_100000_cluster.pickle"

# Path to pace lookup file
pace_lookup: "../data/pace_lookup.pickle"

# Device to use (cpu/cuda/mps)
device: "cuda"

# Random seed for reproducibility (ensures same examples and calibration samples on re-runs)
# Default: 42 if not specified
random_seed: 42

# Optional: XGBoost model paths (if you want to include XGBoost baseline)
xgb_model: "xgb_first_50_continuous/xgboost_model.json"
xgb_features: "xgb_first_50_continuous/xgboost_feature_columns.pickle"

# List of models to evaluate
# Each model entry has:
#   - name: Internal identifier (used as key in results)
#   - checkpoint: Path to model checkpoint (.pt file)
#   - config: Path to model config YAML file
#   - display_name: Human-readable name for plots
models:
  - name: "model_adaptive_sigma"
    checkpoint: "checkpoints_clean_prod/Production_Scale_AdaptiveSigma_SQRT_Slower/best_model.pt"
    config: "checkpoints_clean_prod/Production_Scale_AdaptiveSigma_SQRT_Slower/config_copy.yaml"
    display_name: "Full Model, Adaptive Sigma"

  - name: "model_ablation"
    checkpoint: "checkpoints_clean_prod/Production_Scale_v2_HighCap_Ablation_NoTime_AgeLastFront_Corrected/best_model.pt"
    config: "checkpoints_clean_prod/Production_Scale_v2_HighCap_Ablation_NoTime_AgeLastFront_Corrected/config_copy.yaml"
    display_name: "Time Token Ablation"

  - name: "model_ablation_shuffled"
    checkpoint: "checkpoints_clean_prod/Production_Scale_v2_HighCap_Ablation_NoTime_AgeLastFront_Shuffled_Corrected_Restart_1/best_model.pt"
    config: "checkpoints_clean_prod/Production_Scale_v2_HighCap_Ablation_NoTime_AgeLastFront_Shuffled_Corrected_Restart_1/config_copy.yaml"
    display_name: "Time Token Ablation with Shuffled Sequence"

  - name: "model_xent"
    checkpoint: "checkpoints_clean_prod/Production_Scale_v2_HighCap_SwappedOrder_Slow_XEnt/best_model.pt"
    config: "checkpoints_clean_prod/Production_Scale_v2_HighCap_SwappedOrder_Slow_XEnt/config_copy.yaml"
    display_name: "Full Model, Cross-Entropy (σ = 0)"

  - name: "model_lambda1"
    checkpoint: "checkpoints_clean_prod/Production_Scale_v2_HighCap_SwappedOrder_Corected_Lambda_1/best_model.pt"
    config: "checkpoints_clean_prod/Production_Scale_v2_HighCap_SwappedOrder_Corected_Lambda_1/config_copy.yaml"
    display_name: "Full Model, σ = 1"

  - name: "model_lambda4"
    checkpoint: "checkpoints_clean_prod/Production_Scale_v2_HighCap_SwappedOrder_Corected_Lambda_4/best_model.pt"
    config: "checkpoints_clean_prod/Production_Scale_v2_HighCap_SwappedOrder_Corected_Lambda_4/config_copy.yaml"
    display_name: "Full Model, σ = 4"

  - name: "model_lambda10"
    checkpoint: "checkpoints_clean_prod/Production_Scale_v2_HighCap_SwappedOrder_Corected_Lambda_10/best_model.pt"
    config: "checkpoints_clean_prod/Production_Scale_v2_HighCap_SwappedOrder_Corected_Lambda_10/config_copy.yaml"
    display_name: "Full Model, σ = 10"

  - name: "model_lambda35"
    checkpoint: "checkpoints_clean_prod/Production_Scale_v2_HighCap_74/best_model.pt"
    config: "checkpoints_clean_prod/Production_Scale_v2_HighCap_74/config_copy.yaml"
    display_name: "Full Model, σ = 35"


