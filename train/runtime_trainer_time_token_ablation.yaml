# Production-scale config (single run) with ablation:
# - Drop week_delta_* tokens entirely
# - Drop all age_* tokens except keep the last age token and move it to the front
#
# Sequence becomes: [age_last] + [8 tokens per race] * (n-1) + [7 tokens for final block]
# = 1 + 8*(n-1) + 7 = 8*n total tokens
# With max_races_to_consider=30 (includes final race), max input length is 8*30 = 240.
#
# This version uses corrected hyperparameters.

model:
  d_model: 512
  nhead: 8
  num_layers: 6
  dim_feedforward: 2048
  dropout: 0.12
  max_races_to_consider: 30
  max_seq_length: 240

training:
  batch_size: 64
  learning_rate: 0.0001
  weight_decay: 0.00118
  epochs: 100
  num_workers: 4
  pin_memory: true
  use_amp: true
  val_split: 0.1
  random_seed: 42
  smoothing_sigma_seconds: 3.0

data:
  splits_dir: "../data/samples"
  pace_lookup: "../data/pace_lookup.pickle"
  num_files_to_load: 1

  # Grammar layout
  block_stride: 11

  # Ablation controls
  ablation_drop_week_deltas: true
  ablation_last_age_front: true
  ablation_out_stride: 8

logging:
  project_name: "RunTime-Public"
  run_name: "runtime-time-token-ablation"
  log_interval: 10
  save_dir: "checkpoints_clean_prod"
  use_wandb: true



