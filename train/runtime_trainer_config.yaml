# Production-scale config using fixed sigma smoothing and corrected hyperparameters.

model:
  d_model: 512
  nhead: 8
  num_layers: 6
  dim_feedforward: 2048
  dropout: 0.12
  max_races_to_consider: 30
  max_seq_length: 329

training:
  batch_size: 64
  learning_rate: 0.0001
  weight_decay: 0.00118
  epochs: 100
  num_workers: 4
  pin_memory: true
  use_amp: true
  val_split: 0.1
  random_seed: 42
  smoothing_sigma_seconds: 3.0

  # To match the old "Production_Scale" behavior more closely, enable per-epoch checkpoints if you want:
  # save_epoch_checkpoints: true
  # checkpoint_every_n_epochs: 1
  # latest_checkpoint_every_n_epochs: 1

data:
  splits_dir: "../data/samples"
  pace_lookup: "../data/pace_lookup.pickle"
  num_files_to_load: 1

  block_stride: 11

logging:
  project_name: "RunTime-Public"
  run_name: "runtime"
  log_interval: 10
  save_dir: "checkpoints_clean_prod"
  use_wandb: true



